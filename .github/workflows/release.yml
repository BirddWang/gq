name: Release

# Publishes to PyPI when a version tag is pushed. Authentication uses PyPI trusted
# publishing (OIDC), so no API token is stored in the repository.
#
# One-time setup at https://pypi.org/manage/account/publishing/ :
#   PyPI project name: gq-local
#   Owner:             BirddWang
#   Repository:        gq
#   Workflow:          release.yml
#   Environment:       pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Fail if the tag and the package version disagree
        run: |
          version="$(uv run python -c 'import gq; print(gq.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $tag does not match gq.__version__ $version" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
